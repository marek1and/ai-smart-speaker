header:
  version: 14

machine: raspberrypi5
distro: aispeaker
target: aispeaker-image

repos:
  # this repository (ai-smart-speaker) — the layer lives in a subdirectory
  ai-smart-speaker:
    layers:
      yocto/meta-aispeaker:

  # wrynose (Yocto 6.0) ships Python 3.14. NOTE: poky as a combined repository
  # is no longer published — its last commit on any branch is from 2026-02 and
  # it never got whinlatter or wrynose. Upstream is now assembled from
  # openembedded-core + bitbake + meta-yocto, which is what we track below.
  # Each repo is pinned; to move to a newer tip update the sha (or drop the
  # line to float on the branch), rebuild, re-pin.
  bitbake:
    url: "https://git.openembedded.org/bitbake"
    # wrynose requires BB_MIN_VERSION 2.18.0
    branch: "2.18"
    commit: 0ad6c1c34a5e07a5f8dd66ab248c1e7b37b69fa9
    # bitbake is not a layer — kas only needs it on PATH
    layers: {}

  openembedded-core:
    url: "https://git.openembedded.org/openembedded-core"
    branch: wrynose
    commit: f7397af248e1e338929d70a910b0fbc2341528ec
    layers:
      meta:

  # provides conf/distro/poky.conf, which our aispeaker distro requires
  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    branch: wrynose
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: wrynose
    commit: 14282a02be9c74a1276a7cda7d6c89e054699a11
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: wrynose
    commit: f62c67921474370829d24a4fa01ef88543f3906b

local_conf_header:
  aispeaker: |
    # Broadcom WiFi/BT firmware (RPi) requires accepting this license flag
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

    # patent-encumbered codecs (gstreamer1.0-plugins-ugly/bad, gst-libav) —
    # accepted so the speaker can decode arbitrary internet radio / YouTube audio
    LICENSE_FLAGS_ACCEPTED += "commercial"

    # meta-raspberrypi also provides rpidistro-ffmpeg; pin the plain one
    # (we only need audio decode, not the RPi video-accel variant) so gst-libav
    # resolves deterministically
    PREFERRED_PROVIDER_ffmpeg = "ffmpeg"

    # hostname and timezone
    hostname:pn-base-files = "aispeaker"
    DEFAULT_TIMEZONE = "Europe/Warsaw"

    # Raspberry Pi 5 — headless
    GPU_MEM = "16"
    ENABLE_UART = "1"
    # dtoverlay=nospi10 carried over from the current config.txt ([pi5] section);
    # disable_splash/boot_delay shave firmware time off the boot
    RPI_EXTRA_CONFIG = "dtoverlay=nospi10\ndisable_splash=1\nboot_delay=0\n"
    CMDLINE:append = " quiet"

    # reSpeaker XVF3800 (USB) must be the ONLY sound card. Onboard bcm2835 audio
    # is already off on Pi5 (the recipe only enables it on Pi3); this appends
    # ",noaudio" to the KMS overlay so HDMI audio doesn't register an ALSA card
    # either (matches the old Raspbian "vc4-kms-v3d,noaudio").
    VC4DTBO = "vc4-kms-v3d,noaudio"


  build-tuning: |
    # DL_DIR/SSTATE_DIR default to ${TOPDIR}/downloads and ${TOPDIR}/sstate-cache
    # (inside the build dir, which kas-container persists on the host as ./build).
    # To share a cache across separate build trees, point these at a path you
    # bind-mount into the container and set it here.
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE += "aispeaker-image"
