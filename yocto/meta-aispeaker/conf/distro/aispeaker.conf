require conf/distro/poky.conf

DISTRO = "aispeaker"
DISTRO_NAME = "AISpeaker Linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = ""

INIT_MANAGER = "systemd"

# Headless appliance: no X11/Wayland/GL, no PulseAudio (PipeWire instead),
# no polkit/rtkit (services get RT via unit rlimits, admin over root SSH),
# WiFi, USB host (reSpeaker). No bluetooth: the speaker is not a BT sink and
# nothing pairs with it, so the stack and its daemon are dead weight. gobject-introspection-data ships the GStreamer
# typelibs Mopidy needs to reach GStreamer through pygobject (gi.repository.Gst).
DISTRO_FEATURES = " \
    acl xattr pam seccomp vfat usrmerge \
    alsa usbhost \
    wifi \
    ipv4 ipv6 \
    systemd \
    gobject-introspection-data \
"

# Bluetooth has to be removed in two more places, or the stack still gets built:
# poky.conf appends its own DISTRO_FEATURES defaults after ours, and
# meta-raspberrypi puts bluetooth in MACHINE_FEATURES (which is what pulls in
# bluez5 + pi-bluetooth).
DISTRO_FEATURES:remove = "bluetooth"
MACHINE_FEATURES:remove = "bluetooth"

# Headless: no compositor, no X11, nothing renders. Dropping these removes the
# Mesa userspace (libgallium 19 MB, libvulkan_broadcom 11 MB, libgbm, the EGL/
# GLES libs) and wayland. vc4graphics stays in MACHINE_FEATURES on purpose —
# it puts the KMS overlay in config.txt, which is what keeps an HDMI console
# available for debugging a device that will not boot.
DISTRO_FEATURES:remove = "opengl vulkan wayland"

# No SBOM. wrynose moved create-spdx into INHERIT_DISTRO in oe-core, so every
# distro gets it by default; it adds do_create_spdx / do_create_recipe_spdx /
# do_create_package_spdx to every recipe — measured at 16% of all build tasks —
# and produces compliance artefacts a home appliance has no use for.
INHERIT:remove = "create-spdx"

# smaller filesystem, faster boot
VIRTUAL-RUNTIME_initscripts = ""

# no package manager on the target — the image is read-only,
# system updates ship as a whole new image
PACKAGE_CLASSES = "package_ipk"

# reproducible-ish: pinned versions, no AUTOREV
BB_STRICT_CHECKSUM = "1"
