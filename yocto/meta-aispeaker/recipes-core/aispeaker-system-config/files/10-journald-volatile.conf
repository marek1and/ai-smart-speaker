[Journal]
# Journal in RAM only — zero writes to the SD card.
# History is lost on reboot; for durable logs use NFS/remote (see README).
Storage=volatile
RuntimeMaxUse=64M
MaxLevelStore=debug

# Persistent variant on the data partition (requires bind-mounting
# /data/var/log/journal onto /var/log/journal — analogous to
# var-lib-NetworkManager.mount):
#Storage=persistent
