# Network-facing LAN appliance: key-only login, no passwords.
# 'speaker' is used for app deploys (rsync), 'root' for administration
# (systemctl/nmcli) — there is no sudo on the image. Root login is
# key-only (prohibit-password), so a leaked/blank password can't be used.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
