[Journal]
# Persistent journal on the data partition. The rootfs is read-only and /var/log
# is volatile by default, so aispeaker-log-shipping bind-mounts
# /data/var/log/journal onto /var/log/journal before journald flushes.
#
# Raspbian kept this volatile to spare the SD card, which cost us the entire
# history on every reboot. Here /data is written anyway (venv, recordings,
# state), so the trade is worth it — capped so the journal cannot fill it.
Storage=persistent
SystemMaxUse=200M
RuntimeMaxUse=64M
MaxLevelStore=debug
