# RAUC on the speaker: two rootfs slots, switched by the RPi5 firmware's
# tryboot through a custom bootloader backend (aispeaker-update). Each rootfs
# slot owns a boot partition (A: p2, B: p3) that the post-install handler fills
# from the new rootfs; it is not a RAUC slot of its own.
[system]
compatible=aispeaker-rpi5
bootloader=custom
data-directory=/data/state/rauc

[handlers]
bootloader-custom-backend=/usr/lib/aispeaker-update/rpi-tryboot-backend
post-install=/usr/lib/aispeaker-update/install-boot-partition

[keyring]
path=/usr/lib/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p4
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p5
type=ext4
bootname=B
