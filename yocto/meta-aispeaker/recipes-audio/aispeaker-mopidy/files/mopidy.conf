# Base Mopidy configuration (non-secret). Extension config that carries
# credentials (Spotify, YouTube Music auth) belongs in /data/mopidy/mopidy.conf,
# which the service merges on top of this one. Keep secrets on /data, not git.

[core]
cache_dir = /data/cache/mopidy
config_dir = /etc/mopidy
data_dir = /data/mopidy

[audio]
# Route through pipewire-pulse (system mode). pulsesink is reliable and needs
# only gstreamer1.0-plugins-good; PULSE_SERVER is set in the service unit.
output = pulsesink server=unix:/run/pipewire/pulse/native
mixer = software

[mpd]
# MPD-protocol frontend — the application connects here (unchanged from MPD)
enabled = true
hostname = 127.0.0.1
port = 6600

[http]
# lightweight web UI / API on the LAN; harmless, handy for debugging
enabled = true
hostname = 0.0.0.0
port = 6680

[stream]
# internet radio (what the app adds today as stream URLs)
enabled = true
protocols = http, https, mms, rtmp, rtmps, rtsp

[file]
enabled = true
media_dirs = /data/music|Music

[m3u]
# No local playlists; left on, it fails on the unset $XDG_MUSIC_DIR.
enabled = false

[youtube]
# YouTube + YouTube Music. Basic search/playback needs no credentials; for the
# YouTube Music API set youtube_api_key / ytmusic auth in /data/mopidy/mopidy.conf.
enabled = true
youtube_dl_package = yt_dlp
# Search through YouTube Music (ytmusicapi, no login needed): ~1.5 s on the Pi
# vs 9-16 s for the default scraper, which blocks Mopidy's core (MPD stops
# answering) for the whole search. Also returns proper artists and albums.
musicapi_enabled = true
# Let yt-dlp download the track and play it from the cache. A stream URL from
# yt-dlp handed to GStreamer gets HTTP 403 (it is tied to the client that
# fetched it), and after such a failure Mopidy answered 403 for the radio too.
# Old files are removed by systemd-tmpfiles (aispeaker-mopidy.conf).
allow_cache = true
# Download only the current track and the next one (patch 0004). Upstream
# downloads the whole queue, ~8 s per track, and a new request waits behind it.
prefetch_tracks = 1

[spotify]
# Installed but OFF: playback needs the librespot GStreamer plugin
# (gst-plugins-spotify) which is NOT in the base image — see yocto/README.md.
# Enable here (or in /data/mopidy/mopidy.conf) and add Premium credentials:
#   enabled = true
#   client_id = ...
#   client_secret = ...
enabled = false
