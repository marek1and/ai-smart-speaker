# Example configuration file for AI Smart Speaker — Home Assistant backend.
# To use, copy this file to 'config.ha.yml', fill in your credentials, then:
#   ln -sf config.ha.yml config.yml

api_keys:
  # Google API Key (required for Gemini Live API)
  google_api_key: "YOUR_GOOGLE_API_KEY_HERE"
  # OpenAI API Key (required for OpenAI Real-time API)
  openai_api_key: "YOUR_OPENAI_API_KEY_HERE"

home_assistant:
  # Base URL of your Home Assistant instance
  url: "http://YOUR_HA_IP:8123"
  # Long-lived access token: Profile → Security → Long-lived access tokens
  api_key: "YOUR_HA_LONG_LIVED_TOKEN"
  # request_timeout: 5.0  # seconds; raise if HA is slow to respond over the network

audio:
  # Input settings (microphone)
  input_sample_rate: 16000
  input_channels: 2
  input_chunk: 512
  input_device: null  # Device name or null for default

  # Output settings (speaker)
  output_sample_rate: 24000
  output_channels: 1
  output_device: null # Device name or null for default

  # Queue sizes
  input_queue_maxsize: 50
  output_queue_maxsize: 500

wake_word:
  model_id: "alexa"  # Built-in: alexa, hey_mycroft, hey_jarvis, hey_rhasspy
  # model_path: "/path/to/custom_model.onnx"  # Custom model file (overrides model_id)
  threshold: 0.8
  # Silero VAD gate: scores zeroed on non-speech frames — prevents false triggers
  # during silence, ambient noise, or distant TV. 0 = disabled, 0.5 = recommended.
  vad_threshold: 0.5
  window_seconds: 0.8
  cooldown_seconds: 2.5
  min_activation_frames: 2
  # STT post-trigger verification via faster-whisper (reduces false positives).
  # Runs in parallel with session open — no added latency for valid triggers.
  # Requires: pip install faster-whisper
  verify_with_stt: false
  stt_model: "tiny.en"  # Options: tiny.en, base.en, small.en
  stt_keywords: ["alexa", "alexia", "aleksa", "lexa"]

vad:
  # VAD mode: "silero" (recommended) or "rms"
  mode: "silero"

  # Silero VAD settings
  silero_threshold: 0.6
  silero_frame_size: 512

  # RMS VAD settings
  rms_threshold: 1500.0

  # Temporal smoothing
  speech_frames_required: 3
  silence_frames_required: 15

live:
  # AI provider selection. Options: "gemini" or "openai"
  provider: "gemini"

  # System instruction defining assistant behavior. This is a crucial part of the configuration.
  # The example below is for an English-speaking assistant named Alexa, integrated with Home Assistant.
  # Customize the persona, rules, and especially the device list for your own setup.
  # Use entity IDs from your HA instance (Developer Tools → States, or GET /api/states).
  #
  # State formats for set_ha_entity_state:
  #   light.*        — "ON"/"OFF", brightness "0"-"100", color "H,S,B" (hue 0-360, sat 0-100, bri 0-100)
  #   switch.*, fan.* — "ON"/"OFF"
  #   cover.*        — position "0"-"100" (0=closed, 100=open)
  #   media_player.* — "ON"/"OFF", volume "0"-"100", "MUTE"/"UNMUTE"
  system_instruction: |
    You are a voice assistant controlling a smart home integrated with Home Assistant.
    Your name is Alexa, and you identify as female, so you should respond accordingly.
    You understand and speak only English, unless explicitly asked to translate to another language.
    You are versatile: you manage the house but also answer general knowledge questions.
    Respond concisely, in one sentence, unless asked for a detailed explanation.
    Location: YOUR_CITY, YOUR_COUNTRY. Time zone: YOUR_TIMEZONE.
    You have access to tools get_ha_entity_state, set_ha_entity_state, get_ha_entities_state and
    set_ha_entities_state to control devices and read their state.
    Always use the full entity_id (e.g. light.living_room_main). Only use entity_id values from
    the list below — never guess or invent one.
    For aggregate questions ("are all lights off?") or group commands ("turn off all lights in
    the living room"), call get_ha_entities_state/set_ha_entities_state ONCE with the full list of
    matching entity_id values instead of calling the single-entity tools in a loop.

    Here is the complete list of available rooms and devices with their entity_id values:

    ### GROUND FLOOR (GF)

    **Living Room**
    *   **Lighting:**
        *   Main: `light.living_room_main` (ON/OFF + brightness 0-100%)
        *   Dimmer: `light.living_room_dimmer` (ON/OFF + brightness 0-100%)
    *   **Climate (read-only):**
        *   Temperature: `sensor.temperature_living_room`
    *   **Windows (read-only):**
        *   Terrace Window: `binary_sensor.window_terrace`

    **TV (Living Room)**
    *   Turn on or switch channel: use `watch_tv(channel_name="BBC One")` or `watch_tv()`.
        Always use this function — never set_ha_entity_state for TV power or channels.
    *   Turn off TV: `set_ha_entity_state(entity_id='media_player.living_room_tv', state='OFF')`.
    *   Volume: `set_ha_entity_state(entity_id='media_player.living_room_tv', state='50')` (0-100).
    *   Mute: `set_ha_entity_state(entity_id='media_player.living_room_tv', state='MUTE')`.
    *   Available TV channels (pass exact name to watch_tv): {tv_channels}

    ### FIRST FLOOR (FF)

    **Bedroom**
    *   **Lighting:**
        *   Bedside Lamp: `light.bedroom_bedside` (ON/OFF + brightness 0-100%)
    *   **Other:**
        *   Roller shutter: `cover.bedroom_shutter` (0=closed, 100=open)
        *   USB charger: `switch.bedroom_usb`

    ---

    ### OPERATING RULES:
    1.  If the user asks to turn a light on/off, use the appropriate entity_id.
        If the light supports brightness and no percentage is given, use "ON"/"OFF".
        If the user gives a percentage, send the numeric value (e.g. "50").
    2.  If the user does not specify which light (e.g. "turn on the light in the living room"),
        assume they mean the main light (light.*_main).
    3.  Entities with sensor.* or binary_sensor.* are read-only.
    4.  Roller shutters: 0=closed, 100=open.
    5.  Radio rules:
        - Available pinned stations: {radio_stations}. Use these names as station_name.
        - Turn on radio (no station): call `play_internet_radio()` and say "Playing the radio."
        - Turn on radio (with station): call `play_internet_radio(station_name="...")` and say "Playing [station]."
        - Turn off radio: call `stop_radio()` and say "Stopping the radio."
        - Change station: call `play_internet_radio(station_name="...")` with the new station.
        - Check what's playing: only then call `get_radio_status`.
        - Radio tools are async — speak and end the turn immediately after calling.
    6.  After changing a device state, always provide a brief spoken confirmation.
    7.  If you need clarification or expect a user response, ALWAYS call `request_for_user_input`
        before asking the question.

  temperature: 0.2
  response_modalities: ["AUDIO"]
  lang: "en-US"

  # Audio format settings
  send_sample_rate: 16000
  receive_sample_rate: 24000
  input_mime_type: "audio/pcm;rate=16000"

  preroll_seconds: 1.5
  barge_in: true
  session_inactivity_timeout: 30.0
  max_reconnect_attempts: 3
  followup_timeout: 3.0

  enable_manual_vad: true
  api_vad_timeout: 2.0
  turn_watchdog_timeout: 5.0

  # Gemini-specific settings
  model: "gemini-3.1-flash-live-preview"
  voice_name: "Zephyr" # Options: Aoede, Charon, Fenrir, Kore, Puck, Zephyr

  # OpenAI-specific settings
  openai_model: "gpt-realtime"
  openai_voice: "shimmer" # Options: alloy, ash, ballad, coral, echo, sage, shimmer, verse

sound:
  enabled: true
  volume: 1.0
  sounds_dir: null # Custom sounds directory (null = default)
  output_device: null # Audio device for sounds (null = default)

radio:
  # Country used as filter for RadioBrowser name search (fallback for unpinned stations)
  country: "Poland"

  # Pinned stations: stable RadioBrowser UUIDs guarantee the correct station is
  # always resolved, even when stream URLs change. Resolved URLs are cached in
  # radio_state.json — subsequent plays require no RadioBrowser API call.
  #
  # Find UUIDs at https://www.radio-browser.info (station detail page).
  # Station names listed here are injected into the system prompt via {radio_stations}
  # so the model knows exactly which names to pass to play_internet_radio().
  stations:
    rmf fm:
      uuid: "399b7c2a-6680-11e8-b15b-52543be04c81"
      name: "RMF FM"
    radio zet:
      uuid: "59e30dda-64bf-11ea-be63-52543be04c81"
      name: "Radio Zet"

tv:
  # Home Assistant entity used to power the TV on/off.
  # Normally a media_player entity, which also enables channel switching.
  # If your TV's media_player integration can't power it on remotely (many
  # can't wake a fully-off TV), point this at a switch entity instead — e.g.
  # a "switch.tv_wake_on_lan" backed by HA's wake_on_lan integration. In that
  # case channel switching is unavailable (the TV must already be on).
  power_item: "media_player.living_room_tv"

  boot_wait_timeout: 20.0  # Max seconds to wait for TV to confirm ON
  boot_poll_interval: 1.0
  post_boot_delay: 5.0     # Extra seconds after TV confirms ON before sending channel

  # TV channel mapping: name (as user says it) -> channel number.
  # Names listed here are injected into the system_instruction via {tv_channels}.
  channels:
    "BBC One": 101
    "BBC Two": 102
    "ITV": 103

mpd:
  host: "localhost"
  port: 6600
  connection_timeout: 5
  state_poll_interval: 2.0  # How often to detect external MPD state changes (stream died, mpc)
  volume_fade_in_seconds: 1.0  # Duration of volume fade-in (resuming)
  volume_duck_percentage: 20   # Volume percentage during conversation
  default_playback_volume: 70  # Default playback volume if no previous volume is known
  state_file: "radio_state.json"  # Persists current station, URL cache, and play counts

mqtt:
  enabled: false
  broker: "192.168.1.x"
  port: 1883
  topic_prefix: "home/living-room/speaker"
  # username: ~
  # password: ~
  reconnect_interval: 5.0
  # Topics published (retain=true):
  #   {topic_prefix}/radio/availability → online / offline (LWT; HA availability_topic)
  #   {topic_prefix}/radio/state    → ON / OFF
  #   {topic_prefix}/radio/station  → station name
  #   {topic_prefix}/radio/volume   → 0-100
  # Topics subscribed (commands from HA automations):
  #   {topic_prefix}/radio/command/power    → ON / OFF
  #   {topic_prefix}/radio/command/station  → station name (loads without playing if radio is off)
  #   {topic_prefix}/radio/command/volume   → 0-100
