monitor.alsa.rules = [
  # --- XVF3800 OUTPUT + INPUT: always active ---
  # No api.alsa.period-size/period-num here: 240 x 4 forced quantum 240 and
  # "out of buffers" warnings against the fixed quantum 480 (b9c872b).
  {
    matches = [
      { node.name = "~alsa_(output|input)\\.usb-Seeed_Studio_reSpeaker.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
]
