context.properties = {
  # 480 is not a power of two (= 10ms @ 48kHz); must disable the default restriction
  clock.power-of-two-quantum = false

  # Lock to 48kHz — the XVF3800's only supported rate
  default.clock.rate = 48000
  default.clock.allowed-rates = [ 48000 ]

  # Fixed quantum: 480 samples = 10ms. Prevents PipeWire from switching to a
  # larger quantum (default 1024) which would double scheduling latency.
  default.clock.quantum = 480
  default.clock.min-quantum = 480
  default.clock.max-quantum = 480
}
