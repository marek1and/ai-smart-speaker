apiVersion: 1

# Alert on the speaker's own view of its MQTT link. The broker dropped the speaker on
# 07.09.2026 08:09 and the app only started logging errors 42 h later, but
# speaker_mqtt_connected read 0 the whole time — the log is not a usable signal, the
# metric is. No data (app or Pi down, series gone stale) counts as an alarm too.
#
# Delivery goes through a Home Assistant webhook to the phone, like the UPS alerts.
# The receiver is set per rule (notification_settings), so the default notification
# policy tree stays untouched.

contactPoints:
  - orgId: 1
    name: ha-telefon
    receivers:
      - uid: ha-telefon-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://192.168.1.9:8123/api/webhook/HA_WEBHOOK_ID
          httpMethod: POST

groups:
  - orgId: 1
    name: glosnik
    folder: Głośnik
    interval: 1m
    rules:
      - uid: glosnik-mqtt-down
        title: Głośnik – brak połączenia MQTT
        condition: B
        for: 10m
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: min(speaker_mqtt_connected{job="ai-smart-speaker"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        annotations:
          summary: Głośnik nie ma połączenia z brokerem MQTT (albo aplikacja nie odpowiada) od ponad 10 min — radio nie reaguje na HA/KNX.
        notification_settings:
          receiver: ha-telefon
